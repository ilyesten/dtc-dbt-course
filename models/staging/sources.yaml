sources:
  - name: staging
     
    description : > 
      Loaded by the Kestra flow 09_gcp_taxi_scheduled (monthly CSV → GCS → MERGE into native BigQuery tables.
      Contains both yellow and green taxi trip records for 2019.
    database: dtc-de-course-510513 
    schema: trips_data_all 

    tables:
      - name: green_tripdata
        config:
          loaded_at_field : lpep_pickup_datetime
          freshness :
            warn_after : {count: 6, period: hour}
            error_after : {count: 12, period: hour}

        description : >
          Green taxi trip records. Green taxis operate primarily in
          outer boroughs (outside Manhattan).
      - name: yellow_tripdata
        config:
          loaded_at_field: tpep_pickup_datetime
          freshness :
            warn_after : {count: 6, period: hour}
            error_after : {count: 12, period: hour}

        description : Yellow taxi trips, primarily from Manhattan
