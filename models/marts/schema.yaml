models:
  - name: dim_zones
    description: NYC taxi zones, built from the taxi_zone_lookup seed. One row per zone (265 rows).
    config:
      meta:
        owner: ilyes
    columns:
      - name: location_id
        description: Primary key of the taxi zone.
      - name: borough
        description: NYC borough (Manhattan, Queens, Brooklyn, Bronx, Staten Island, EWR).
      - name: zone
        description: Zone or neighborhood name.
      - name: service_zone
        description: Service zone type (Yellow Zone, Boro Zone, Airports).

  - name: dim_vendors
    description: >
      Technology providers found in the trip data. One row per vendor.
      Labels are generated by the get_vendor_data macro.
    config:
      meta:
        owner: ilyes
    columns:
      - name: vendor_id
        description: Primary key of the vendor.
      - name: vendor_name
        description: >
          Provider name. 'Unknown/Other' for the undocumented code 4,
          'Unmapped' for any code missing from the macro (should never appear).