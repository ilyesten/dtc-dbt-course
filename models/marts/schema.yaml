models:
  - name: dim_zones
     


    description: NYC taxi zones, built from the taxi_zone_lookup seed. One row per zone (265 rows).
    config:
      meta:
        owner: ilyes
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null
          
        description: Primary key of the taxi zone.
      - name: borough
        description: NYC borough (Manhattan, Queens, Brooklyn, Bronx, Staten Island, EWR).
      - name: zone
        description: Zone or neighborhood name.
      - name: service_zone
        description: Service zone type (Yellow Zone, Boro Zone, Airports).

  - name: dim_vendors

    description: >
      Technology providers found in the trip data. One row per vendor.
      Labels are generated by the get_vendor_data macro.
    config:
      materialized: table
      contract: 
        enforced: true
      meta:

        owner: ilyes
    columns:
      - name: vendor_id
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
        description: Primary key of the vendor.
      - name: vendor_name
        data_type: string
        constraints:
          - type: not_null  
        data_tests:
            - accepted_values:
                arguments:
                  values: ['VeriFone Inc','Creative Mobile Technologies','Unknown/Other']
        description: >
          Provider name. 'Unknown/Other' for the undocumented code 4,
          'Unmapped' for any code missing from the macro (should never appear).
unit_tests:
  - name: test_vendor_unit
    model: dim_vendors
    given:
      - input: ref('int_trips_unioned')
        rows: 
          - {vendor_id: 1}
          - {vendor_id: 1}
          - {vendor_id: 2}
          - {vendor_id: 4}
          - {vendor_id: 99}
    expect:
        rows:
          - {vendor_id: 1, vendor_name: 'Creative Mobile Technologies' }
          - {vendor_id: 2, vendor_name: 'VeriFone Inc' }
          - {vendor_id: 4, vendor_name: 'Unknown/Other' }
          - {vendor_id: 99, vendor_name: 'Unmapped' }